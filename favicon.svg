<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b76ff"/>
      <stop offset="100%" stop-color="#0047ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <style>
    .bg-squircle {
      fill: url(#bgGrad);
      stroke: #1e2638;
      stroke-width: 8;
    }
    .text-glyph {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #ffffff;
    }
    .accent-box {
      fill: url(#blueGrad);
    }
    @media (prefers-color-scheme: light) {
      .bg-squircle {
        stroke: #0047ff;
        stroke-width: 10;
      }
    }
  </style>

  <!-- Squircle Rounded Tech Background -->
  <rect class="bg-squircle" x="16" y="16" width="480" height="480" rx="108" ry="108"/>
  
  <!-- Subtle Inner Tech Border Accent -->
  <rect x="36" y="36" width="440" height="440" rx="90" ry="90" fill="none" stroke="rgba(0, 71, 255, 0.18)" stroke-width="3"/>

  <!-- Stylized Geometric 'A' Monogram -->
  <path d="M 180 370 L 256 140 L 332 370 L 276 370 L 256 304 L 210 304 L 198 340 L 236 340 L 244 370 Z M 224 258 L 256 168 L 288 258 Z" fill="#ffffff"/>

  <!-- Brand Signature Cobalt Blue Accent Dot/Square -->
  <rect class="accent-box" x="350" y="320" width="46" height="46" rx="8" filter="url(#neonGlow)"/>
</svg>
